name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://product_tracker:product_tracker@localhost:5432/product_tracker?schema=public
      DIRECT_URL: postgresql://product_tracker:product_tracker@localhost:5432/product_tracker?schema=public
      API_BEARER_TOKEN: ci-only-token-that-is-long-enough
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: product_tracker
          POSTGRES_USER: product_tracker
          POSTGRES_PASSWORD: product_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U product_tracker -d product_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Ensure production runtime role exists in CI Postgres
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({
            connectionString: "postgresql://product_tracker:product_tracker@localhost:5432/product_tracker",
          });
          await client.connect();
          const existing = await client.query("SELECT 1 FROM pg_roles WHERE rolname = $1", ["product_tracker_runtime"]);
          if (existing.rowCount === 0) {
            await client.query("CREATE ROLE product_tracker_runtime NOLOGIN");
          }
          await client.end();
          NODE
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run cloudflare:dry
      - run: npm run cloudflare:reliability:dry
